      description: Returns current budget usage and hardware telemetry.
      tags: [Oversight]
      responses:
        '200':
          description: Quota and defense metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityQuotaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/oversight/security/quotas/{entity_id}:
    put:
      operationId: updateAgentQuota
      summary: Update agent resource quota
      description: Updates or inserts a per-agent budget ceiling in the oversight database.
      tags: [Oversight]
      parameters:
        - name: entity_id
          in: path
          required: true
          schema: { type: string }
          description: The agent or entity identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                budget_usd: { type: number, format: double }
      responses:
        '200': { description: Quota updated }
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/oversight/security/integrity:
    get:
      operationId: getSecurityIntegrity
