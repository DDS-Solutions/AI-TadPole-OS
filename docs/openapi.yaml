      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookDefinition'
      responses:
        '200':
          description: Hook saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "saved" }
    delete:
      operationId: deleteHook
      summary: Delete a system hook
      tags: [Skills]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
