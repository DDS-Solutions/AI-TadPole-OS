      tags: [Infrastructure]
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelCatalogEntry'

  /v1/infra/model-store/pull:
    post:
      operationId: pullModel
      summary: Pull Model to Swarm Node
      description: Proxies a model pull request to a specific Swarm node's local inference engine.
      tags: [Infrastructure]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, model_name]
              properties:
                node_id: { type: string }
                model_name: { type: string }
                insecure: { type: boolean, default: false }
      responses:
        '202': { description: Model pull initiated }
        '404': { description: Node or Model not found }

  /v1/governance/blueprints:
    get:
      operationId: listGovernanceBlueprints
      summary: List all agent role blueprints
      description: Returns a list of all reusable role blueprints in the governance registry.
      tags: [Governance]
      responses:
        '200':
          description: List of blueprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleBlueprint'
    post:
      operationId: saveGovernanceBlueprint
      summary: Create or update a role blueprint
      description: Persists a role blueprint to the governance store.
      tags: [Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBlueprint'
      responses:
        '200':
          description: Blueprint saved

  /v1/governance/blueprints/{id}:
    delete:
      operationId: deleteGovernanceBlueprint
      summary: Delete a role blueprint
      tags: [Governance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Blueprint removed }

  /v1/oversight/security/policies:
    get:
      operationId: getGovernancePolicies
      summary: List dynamic tool permission policies
      description: Returns the collection of active tool permission policies from the SQLite database.
      tags: [Oversight]
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdatePolicyPayload'
    put:
      operationId: updateGovernancePolicy
      summary: Update dynamic tool permission policy
      description: Updates or inserts a tool permission policy in the SQLite database.
      tags: [Oversight]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyPayload'
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }

  /v1/oversight/security/snapshot:
    get:
      operationId: getSecuritySnapshot
      summary: Get consolidated system security snapshot
      description: Returns a consolidated system security snapshot including quotas, agent health, and the latest audit trail logs.
      tags: [Oversight]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Security snapshot returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotas:
                    type: object
                  agent_health:
                    type: array
                    items:
                      type: object
                  audit_trail:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/agents/{agent_id}/memories:
    get:
      operationId: getAgentMemory
      summary: Get Agent Memories
      description: Returns a paginated list of long-term vector memory entries for a specific agent.
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique agent identifier.
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Memory entries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        text: { type: string }
                        mission_id: { type: string }
                        timestamp: { type: number, format: double }
        '404':
          description: Agent or memory not found
        '500':
          description: Failed to query vector database
    post:
      operationId: saveAgentMemory
      summary: Record New Memory
      description: Manually records a new text memory for an agent (triggers embedding).
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text content of the memory.
                mission_id:
                  type: string
                  description: Optional mission ID associated with the memory.
              required:
                - text
      responses:
        '201':
          description: Memory recorded successfully
        '400':
          description: Invalid request body
        '404':
          description: Agent not found
  /v1/agents/{agent_id}/memories/{row_id}:
    delete:
      operationId: deleteAgentMemory
      summary: Delete Memory Entry
      description: Deletes a specific vector memory entry by its underlying row ID.
      tags: [Agents]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique agent identifier.
          schema:
            type: string
        - name: row_id
          in: path
          required: true
          description: The LanceDB row index.
          schema:
            type: integer
      responses:
        '204':
          description: Memory deleted successfully
        '404':
          description: Agent or memory not found
        '500':
          description: Failed to query vector database

  /v1/skills/{name}:
    get:
      operationId: getSkill
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

  /v1/docs/knowledge:
    get:
      operationId: listKnowledge
      summary: List knowledge documents
      description: Returns a list of all available knowledge document categories and entries.
      tags: [Docs]
      responses:
        '200': { description: Success }

  /v1/docs/knowledge/{category}/{name}:
    get:
      operationId: getKnowledgeDoc
      summary: Get a knowledge document
      description: Returns the raw markdown content of a specific knowledge document.
      tags: [Docs]
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
          description: The document category (e.g. architecture, operations).
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The document name (without extension).
      responses:
        '200':
          description: Document returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  category: { type: string }
                  content: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/docs/operations-manual:
    get:
      operationId: getOperationsManual
      summary: Get Operations Manual
      description: Returns the full rendered Operations Manual in structured JSON format for in-app display.
      tags: [Docs]
      responses:
        '200':
          description: Operations manual returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string, description: 'Markdown content of the Operations Manual.' }
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/env-schema:
    get:
      operationId: getEnvSchema
      responses:
        '200': { description: Success }

  /v1/engine/templates/install:
    post:
      operationId: installTemplate
      summary: Install a swarm template
      description: Clones and installs a swarm blueprint from a public Git repository into the engine vault.
      tags: [Engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository_url, path]
              properties:
                repository_url: { type: string }
                path: { type: string }
                model_override:
                  type: object
                  required: [provider, model_id]
                  properties:
                    provider: { type: string }
                    model_id: { type: string }
                    base_url: { type: string }
      responses:
        '200': { description: Template installed successfully }
        '400': { description: Invalid template path or traversal attempt }
        '500': { description: Git clone or merge error }

  /v1/engine/templates/import:
    post:
      operationId: importTemplate
      summary: Import and register a local swarm archive or blueprint
      description: Ingests raw agent definitions and workflow playbooks directly from a downloaded or local swarm archive into the engine vault and agent inventory.
      tags: [Engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swarm]
              properties:
                swarm: { type: object }
                agents:
                  type: array
                  items:
                    type: object
                    required: [filename, content]
                    properties:
                      filename: { type: string }
                      content: { type: object }
                workflows:
                  type: array
                  items:
                    type: object
                    required: [filename, content]
                    properties:
                      filename: { type: string }
                      content: { type: string }
                mcps: { type: object }
                overwrite: { type: boolean }
                model_override:
                  type: object
                  required: [provider, model_id]
                  properties:
                    provider: { type: string }
                    model_id: { type: string }
                    base_url: { type: string }
      responses:
        '200': { description: Swarm imported and registered successfully }
        '400': { description: Invalid swarm schema or asset payload }
        '403': { description: Refusing to overwrite existing file without overwrite flag }

  /v1/system/environment:
    post:
      operationId: updateEnvironmentVariables
      summary: Securely update environment variables
      description: Persists environment variables (such as MCP API keys) to the local .env configuration and runtime state.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Environment variables updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  updated_keys:
                    type: array
                    items: { type: string }
        '400': { description: Invalid variable name }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/engine/templates/catalog:
    get:
      operationId: getTemplatesCatalog
      summary: Get Community Template Catalog
      description: |
        Fetches the official Tadpole OS community template catalog from the
        DDS-Solutions/AI-Tadpole-OS-Industry-Templates GitHub repository.
        Returns an offline fallback list when the remote is unreachable.
      tags: [Engine]
      responses:
        '200':
          description: Template catalog returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, description, repository_url, path]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    repository_url: { type: string }
                    path: { type: string }
                    required_models:
                      type: array
                      items: { type: string }
                    required_skills:
                      type: array
                      items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/engine/templates/installed:
    get:
      operationId: getInstalledTemplates
      summary: List installed swarm templates
      description: Returns all currently installed swarm templates with registered member agents and workflows.
      tags: [Engine]
      responses:
        '200':
          description: List of installed swarms
          content:
            application/json:
              schema:
                type: object
                properties:
                  swarms:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, installed_at, template_path]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        industry: { type: string, nullable: true }
                        installed_at: { type: string }
                        template_path: { type: string }
                        agents:
                          type: array
                          items: { type: string }
                        workflows:
                          type: array
                          items: { type: string }
                        mcp_servers:
                          type: array
                          items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/engine/templates/uninstall:
    post:
      operationId: uninstallTemplate
      summary: Uninstall a swarm template
      description: Unregisters agents from SQLite and in-memory state, deletes or archives agent configurations and workflows, and prunes associated MCP configurations.
      tags: [Engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [swarm_id]
              properties:
                swarm_id: { type: string }
                archive: { type: boolean, default: true }
      responses:
        '200':
          description: Swarm uninstalled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  message: { type: string }
                  uninstalled_agents:
                    type: array
                    items: { type: string }
                  uninstalled_workflows:
                    type: array
                    items: { type: string }
                  uninstalled_mcp_servers:
                    type: array
                    items: { type: string }
                  archived_path: { type: string, nullable: true }
        '400': { description: Invalid swarm_id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Installed swarm not found }

  /v1/oversight/pending:
    get:
      operationId: listPendingOversight
