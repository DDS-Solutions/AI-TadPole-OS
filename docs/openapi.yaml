                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OversightEntry'
        '401':
          description: Unauthorized — missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/oversight/ledger:
    get:
      operationId: listOversightLedger
      summary: List recently decided oversight entries
      description: Returns a paginated list of recently decided oversight entries (bounded).
      tags: [Oversight]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated list of decided entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OversightEntry'
        '401':
          description: Unauthorized — missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/oversight/{id}/decide:
    post:
      operationId: decideOversightEntry
