          description: Missing, invalid, stale, or replayed signature

  /v1/remote/oversight/pending:
    get:
      operationId: getRemotePendingOversight
      summary: List pending oversight requests for an authenticated companion
      tags: [Remote]
      security:
        - remoteSignature: []
      parameters:
        - $ref: '#/components/parameters/RemoteDeviceId'
        - $ref: '#/components/parameters/RemoteTimestamp'
        - $ref: '#/components/parameters/RemoteNonce'
      responses:
        '200':
          description: Pending oversight requests
        '401':
          description: Missing, invalid, stale, or replayed signature

  /v1/remote/oversight/trigger-test-item:
    post:
      operationId: triggerRemoteOversightTestItem
      summary: Create a remote oversight test item
      tags: [Remote]
      security:
        - remoteSignature: []
      parameters:
        - $ref: '#/components/parameters/RemoteDeviceId'
        - $ref: '#/components/parameters/RemoteTimestamp'
        - $ref: '#/components/parameters/RemoteNonce'
      responses:
        '201':
          description: Test oversight item created
        '401':
          description: Missing, invalid, stale, or replayed signature

  /v1/remote/oversight/decide:
    post:
      operationId: decideRemoteOversight
      summary: Apply a signed companion decision to authoritative oversight state
      tags: [Remote]
      security:
        - remoteSignature: []
      parameters:
        - $ref: '#/components/parameters/RemoteDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id, decision, decided_by, signature, timestamp, nonce]
              properties:
                approval_id:
                  type: string
                decision:
                  type: string
                  enum: [approved, rejected]
                decided_by:
                  type: string
                  description: Must equal X-Device-Id.
                signature:
                  type: string
                  description: Ed25519 signature over `approval_id:decision:timestamp:nonce`.
                timestamp:
                  type: integer
                  format: int64
                nonce:
                  type: string
                  minLength: 16
                  maxLength: 128
      responses:
        '200':
          description: Authoritative oversight decision result
        '400':
          description: Invalid decision payload
        '401':
          description: Missing, invalid, stale, or replayed signature
        '404':
          description: Authoritative oversight item not found

