      responses:
        '200':
          description: Integrity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityIntegrityResponse'

  /v1/oversight/security/audit-trail:
    get:
      operationId: getAuditTrail
      summary: Get Merkle audit logs
      description: Returns a paginated list of signed audit entries.
      tags: [Oversight]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /v1/oversight/settings:
    get:
      operationId: getOversightSettings
      summary: Retrieve global oversight settings
      description: Returns current governance thresholds, privacy shield status, and auto-approval constraints.
      tags: [Oversight]
      responses:
        '200':
          description: Current oversight settings
    put:
      operationId: updateOversightSettings
      summary: Update global oversight settings
      description: Modifies global security policies (approval thresholds, notification defaults).
      tags: [Oversight]
      responses:
        '200': { description: Settings updated }

  /v1/oversight/security/missions/quotas:
    get:
      operationId: listMissionQuotas
