            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                user_name:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Server-confirmed paired-device metadata
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Device ID not found

  /v1/remote/revoke/{id}:
