          description: Pull initiated

  /v1/infra/providers/{id}/sync:
    post:
      operationId: syncProviderModels
      summary: Discover & Sync Models (IMR-01)
      description: |
        Triggers the Intelligent Model Registry discovery process. 
        Pings the provider, fetches available nodes, and auto-populates 
        the registry with inferred capabilities.
      tags: [Infrastructure]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The local provider identifier.
      responses:
        '200':
          description: Registry synchronized successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  synced_count: { type: integer, example: 5 }
        '404':
          description: Provider not found
        '500':
          description: Remote discovery failure

  /v1/intelligence/graph:
    get:
      operationId: getCodeGraph
      summary: Get Symbol Graph
      description: Returns the full high-fidelity symbol graph for visualization including nodes, edges, and anomalies.
      tags: [Intelligence]
      responses:
        '200':
          description: Symbol graph retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  links:
                    type: array
                    items:
                      type: object
                  anomalies:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/intelligence/blast-radius:
    get:
      operationId: getBlastRadius
      summary: Calculate Blast Radius
      description: Calculates the downstream impact of changing a specific symbol.
      tags: [Intelligence]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name of the symbol.
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: The path of the source file.
      responses:
        '200':
          description: Blast radius calculated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Invalid path boundary or potential path traversal detected
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/knowledge:
    get:
      operationId: listKnowledge
      summary: List Knowledge Entries (IKS)
      description: |
        Returns a paginated, filtered list of all Institutional Knowledge Store entries.
        Supports filtering by concept type, topic, and cluster, with offset/limit pagination.
      tags: [Intelligence]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Maximum number of entries to return (default 50, capped at 200).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of entries to skip for pagination (default 0).
        - name: concept_type
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by OKF concept type (e.g., table, endpoint, playbook).
        - name: topic
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by topic.
        - name: cluster_id
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by cluster ID.
      responses:
        '200':
          description: Paginated list of knowledge entries matching the criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: writeKnowledge
      summary: Write a Knowledge Entry (IKS)
      description: |
        Writes a new entry to the Institutional Knowledge Store. Deduplicates entries
        by content hash and returns the saved entry. Automatically parses and handles
        OKF metadata tags.
      tags: [Intelligence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddKnowledgeRequest'
      responses:
        '200':
          description: Knowledge entry written successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntry'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/knowledge/search:
    get:
      operationId: searchKnowledge
      summary: Semantic Search (IKS)
      description: |
        Performs a semantic k-NN search across all Institutional Knowledge Store entries.
        Requires the `vector-memory` feature to be enabled at build time. Returns the top-k
        most semantically similar entries to the query string.
      tags: [Intelligence]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: The natural-language search query.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of results (default 5, capped at 50).
      responses:
        '200':
          description: Top-k knowledge entries ranked by semantic similarity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Vector memory feature not enabled or LanceDB unavailable

  /v1/knowledge/{id}/confirm:
    post:
      operationId: confirmKnowledge
      summary: Human-Confirm a Knowledge Entry (IKS)
      description: |
        Marks an IKS entry as human-confirmed. Confirmed entries are exempt from
        TTL-based eviction and receive a confidence score of 1.0. Use this to
        promote high-quality machine-generated entries to permanent institutional memory.
      tags: [Intelligence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UUID of the knowledge entry to confirm.
      responses:
        '204':
          description: Entry confirmed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/knowledge/{id}/peers:
    get:
      operationId: getKnowledgePeers
      summary: Retrieve Peer Knowledge Entries (IKS)
      description: Finds similar knowledge entries (peers) based on vector similarity distance, excluding the entry itself.
      tags: [Intelligence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UUID of the knowledge entry to find peers for.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of peer entries to return.
      responses:
        '200':
          description: List of similar knowledge peer entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/knowledge/{id}:
    delete:
      operationId: deleteKnowledge
      summary: Delete a Knowledge Entry (IKS)
      description: |
        Removes an entry by ID from the Institutional Knowledge Store.
        Human-confirmed entries return `409 Conflict` unless `?force=true` is supplied.
      tags: [Intelligence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The UUID of the knowledge entry to delete.
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: If true, bypasses the human-confirmed guard and deletes unconditionally.
      responses:
        '204':
          description: Entry deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entry is human-confirmed — use `?force=true` to override

  /v1/agents/missions/{id}/clone:
    post:
      operationId: cloneMission
      summary: Clone a Mission Cluster
      description: |
        Duplicates an existing mission cluster with its assigned roles, objectives, and parameters.
      tags: [Agents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Mission cluster ID to clone.
      responses:
        '200':
          description: Mission cluster cloned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID of the newly cloned mission cluster
                  name:
                    type: string
                  status:
                    type: string
                required: [id]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/memory/search/bm25:
    get:
      operationId: searchMemoryBm25
      summary: Search Agent Memory with BM25 Lexical Ranking
      description: |
        Performs full-text BM25 lexical search over agent long-term memory entries.
      tags: [Memory]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Lexical search query term.
      responses:
        '200':
          description: Matching memory entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        score:
                          type: number
                          format: float
                        agent_id:
                          type: string
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/memory/graph:
    get:
      operationId: getMemoryGraph
      summary: Retrieve Memory Relationship Knowledge Graph
      description: |
        Returns graph representation of memory connections and document linkages.
      tags: [Memory]
      responses:
        '200':
          description: Memory graph nodes and edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        type:
                          type: string
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        relation:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

responses:
  Unauthorized:
    description: Unauthorized — missing or invalid Bearer token
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ProblemDetails'
  NotFound:
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ProblemDetails'
