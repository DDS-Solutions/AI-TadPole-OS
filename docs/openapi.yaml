                    name: { type: string }
                    steps:
                      type: array
                      items: { type: object }
    post:
      operationId: createWorkflow
      summary: Create a new automation workflow
      description: Registers a new named workflow definition.
      tags: [Continuity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
