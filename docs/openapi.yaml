  /v1/remote/pair:
    post:
      operationId: pairRemoteDevice
      summary: Consume a one-time challenge and register a companion public key
      tags: [Remote]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device_id, device_name, public_key]
              properties:
                token:
                  type: string
                  pattern: '^TP-PAIR-'
                device_id:
                  type: string
                device_name:
                  type: string
                  maxLength: 128
                user_name:
                  type: string
                  maxLength: 128
                public_key:
                  type: string
                  description: Hex or base64 encoded 32-byte Ed25519 public key.
      responses:
        '201':
          description: Companion paired and challenge consumed
        '400':
          description: Invalid device metadata or public key
        '401':
          description: Invalid, expired, or already-consumed pairing challenge
        '429':
          description: Too many failed pairing attempts

  /v1/remote/pairing-token:
    get:
      operationId: generateRemotePairingToken
      summary: Mint a one-time companion pairing challenge
      description: Desktop administrator operation requiring the NEURAL_TOKEN.
      tags: [Remote]
      responses:
        '200':
          description: Three-minute single-use pairing challenge
        '401':
          description: Missing or invalid bearer token

  /v1/remote/devices:
    get:
      operationId: listRemoteDevices
      summary: List registered remote oversight devices
      tags: [Remote]
      responses:
        '200':
