  /v1/engine/a2a/mailbox/send:
    post:
      operationId: sendA2aMailbox
      summary: Send/Queue remote A2A Envelope
      description: |
        Allows remote agents to send an A2A directive envelope to the local swarm queue.
        Requires cryptographic signature verification using the X-A2A-Signature header.
      security: []
      tags: [Engine]
      parameters:
        - name: X-A2A-Signature
          in: header
          required: true
          schema:
            type: string
          description: A signature of the payload (key_id:hex_signature) generated using the sender's active keyring key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, mission_id, source_agent_id, target_agent_id, instruction, status]
              properties:
                id:
                  type: string
                  example: "msg-123"
                mission_id:
                  type: string
                  example: "mission-abc"
                source_agent_id:
                  type: string
                  example: "agent-alice"
                target_agent_id:
                  type: string
                  example: "agent-bob"
                instruction:
                  type: string
                  example: "Deploy database migration"
                reasoning_trace:
                  type: string
                  nullable: true
                status:
                  type: string
                  example: "pending"
                result:
                  type: string
                  nullable: true
                artifacts:
                  type: array
                  items:
                    type: string
                  nullable: true
      responses:
        '202':
          description: Envelope accepted and queued in local database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "queued"
                  envelope_id:
                    type: string
                    example: "msg-123"
        '403':
          description: Invalid or missing A2A signature

