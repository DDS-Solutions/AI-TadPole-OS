[package]
name = "wasm-codec"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
postcard = { version = "1.0", features = ["alloc"] }

