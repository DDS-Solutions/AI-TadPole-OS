# Cargo Deny Configuration — Supply Chain Security & Dependency Auditing

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # `paste` 1.0.15 unmaintained — transitive via optional `lancedb` feature (not in default build graph)
    "RUSTSEC-2024-0449", # `unsafe-libyaml` 0.2.11 unmaintained — transitive via lancedb→lindera→lance-tokenizer (optional vector-memory feature only); our direct dep uses serde_norway which is clean
    "RUSTSEC-2026-0391", # `zstd` 0.13.x — transitive via optional `lancedb` (arrow-ipc 58.x / lance-file); our direct dep uses zstd 0.14.3
    "RUSTSEC-2026-0398", # `zstd-safe` 7.x — transitive via optional `lancedb` (arrow-ipc 58.x / lance-file); our direct dep uses zstd 0.14.3 / zstd-safe 8.2.0
    "RUSTSEC-2026-0403", # `zstd-safe` 7.x — transitive via optional `lancedb` (arrow-ipc 58.x / lance-file); our direct dep uses zstd 0.14.3 / zstd-safe 8.2.0
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
