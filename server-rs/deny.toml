# Cargo Deny Configuration — Supply Chain Security & Dependency Auditing

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
ignore = [
    "RUSTSEC-2025-0012", # `backoff` 0.4.0 unmaintained — no upgrade available
    "RUSTSEC-2025-0057", # `fxhash` 0.2.1 unmaintained — transitive via `bm25`, no upgrade available
    "RUSTSEC-2024-0384", # `instant` 0.1.13 unmaintained — transitive via `backoff`, no upgrade available
    "RUSTSEC-2024-0436", # `paste` 1.0.15 unmaintained — transitive via `lancedb`/`lance`, no upgrade available
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
