name: Delete Failed Workflows

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab on GitHub
  schedule:
    - cron: '0 0 * * *' # Auto-run daily at midnight UTC to keep history clean

permissions:
  actions: write # Required to permit deletion of workflow runs

jobs:
  clean-failed-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Failed Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # Explicitly tells gh CLI the target repo, avoiding checkout/git entirely
        run: |
          echo "🔍 Fetching failed workflow runs for $GH_REPO..."
          # Fetch database IDs of the last 100 failed runs
          failed_runs=$(gh run list --repo "$GH_REPO" --status failure --limit 100 --json databaseId --jq '.[] | .databaseId')

          if [ -z "$failed_runs" ]; then
            echo "✨ No failed workflow runs found. History is clean!"
            exit 0
          fi

          echo "🗑️ Starting batch deletion..."
          for run_id in $failed_runs; do
            echo "Deleting failed run ID: $run_id"
            gh run delete "$run_id"
          done
          echo "✅ Batch deletion complete."
